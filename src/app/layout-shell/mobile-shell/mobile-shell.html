@if (logoutLoading()) {
  <div
    class="flex flex-col gap-4 items-center justify-center fixed h-full w-full z-999 mat-bg-surface-container"
  >
    <mat-spinner></mat-spinner>
    <p>Logging out...</p>
  </div>
}

<div class="mat-bg-surface-container w-full h-screen pt-2 pb-4 px-2 grid grid-rows-[auto_1fr_auto]">
  <header class="flex items-center justify-end py-1">
    <!-- Notification button -->
    <button matIconButton>
      <mat-icon fontIcon="notifications"></mat-icon>
    </button>

    <!-- Logout button -->
    <button matButton class="mat-error-state" (click)="onLogout()">
      <mat-icon fontIcon="logout"></mat-icon>
      Logout
    </button>
  </header>

  <!-- Primary content -->
  <div class="mat-bg-surface-container-lowest h-[80vh] mat-corner-sm relative">
    <div class="h-full overflow-y-auto p-4">
      <ng-content select="[primary]"></ng-content>
    </div>

    <!-- Fab button -->
    <div class="absolute bottom-[2%] right-[4%]">
      <ng-content select="[fab]"></ng-content>
    </div>
  </div>

  <!-- Bottom bar -->
  <aside class="grid grid-cols-2 h-full place-items-center pt-2 pb-2">
    <!-- Projects -->
    <div class="flex flex-col gap-0.5 items-center">
      <div routerLink="/projects" routerLinkActive="activeRoute" class="px-4 mat-corner-full">
        <button matIconButton (click)="onClickProjectDashboard()">
          <mat-icon fontIcon="folders"></mat-icon>
        </button>
      </div>
      <span class="mat-font-label-sm">Projects</span>
    </div>

    <!-- Teams -->
    <div class="flex flex-col gap-0.5 items-center">
      <div routerLink="/teams" routerLinkActive="activeRoute" class="px-4 mat-corner-full">
        <button matIconButton (click)="onClickTeamDashboard()">
          <mat-icon fontIcon="groups"></mat-icon>
        </button>
      </div>
      <span class="mat-font-label-sm">Teams</span>
    </div>
  </aside>
</div>
