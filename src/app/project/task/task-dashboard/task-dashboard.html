@let tasks = taskState();
<!-- Empty state -->
@if (tasks?.length === 0) {
  <div class="p-4 flex flex-col gap-4 w-full">
    <p>No tasks found.</p>
  </div>
} @else {
  <!-- Projects list -->
  <div class="p-4 flex flex-col gap-4 w-full">
    <ul class="flex flex-col gap-4">
      @for (task of tasks; track task.id) {
        <li>
          <div class="cursor-pointer" (click)="onClickTask(task.id)">
            <mat-card class="p-4">
              <mat-card-title>{{ task.name }}</mat-card-title>
              <mat-card-subtitle>{{ task.deadline | date }}</mat-card-subtitle>
            </mat-card>
          </div>
        </li>
      }
    </ul>
  </div>
}
