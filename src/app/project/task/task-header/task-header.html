@let taskName = this.taskName();
@let taskStatus = this.taskStatus();

<section>
  <!-- Task Header -->
  <div class="flex flex-col gap-2">
    @if (!taskName) {
      <mat-spinner diameter="22"></mat-spinner>
    }
    <h1 class="mat-font-title-lg">{{ taskName }}</h1>

    <!-- Badges -->
    <div class="flex gap-2">
      <!-- Status badge -->
      <div
        class="w-fit px-2 py-1 mat-corner-full"
        [ngClass]="{
          'bg-slate-200': taskStatus === 'TODO' || !taskStatus,
          'bg-blue-200': taskStatus === 'IN-PROGRESS',
          'bg-indigo-200': taskStatus === 'SUBMITTED',
          'bg-amber-200': taskStatus === 'REVIEWING',
          'bg-emerald-200': taskStatus === 'APPROVED',
          'bg-red-200': taskStatus === 'REJECTED',
        }"
      >
        <p class="mat-font-label-sm">{{ taskStatus | titlecase }}</p>
      </div>

      <!-- Priority badge -->
      <div class="bg-green-500 w-fit px-2 py-1 mat-corner-full">
        <p class="mat-font-label-sm">High</p>
      </div>
    </div>

    <!-- Assigned to -->
    <div class="flex gap-2">
      <p>Assigned to:</p>
      <p>Assignee name</p>
    </div>
  </div>
</section>
