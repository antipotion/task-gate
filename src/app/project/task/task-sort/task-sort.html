@let todos = todoTask();

<div>
  @if (!todos || todos.length === 0) {
    <!-- No items with status: 'TODO' -->
    <p>No task available</p>
  } @else {
    @for (task of todos; track task.id) {
      <div (click)="onSelectTask(task.id)" class="cursor-pointer">
        <mat-card>
          <mat-card-content>
            <p>{{ task.name }}</p>
          </mat-card-content>
        </mat-card>
      </div>
    }
  }
</div>
