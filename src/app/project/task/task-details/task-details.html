@let activeTaskData = activeTask();

@if (isLoading()) {
  <app-loading />
} @else {
  <div class="p-4 flex flex-col gap-4 w-full">
    <!-- Navigation and some functions -->
    <div class="flex justify-between">
      <!-- Back button -->
      <button matIconButton (click)="onBack()">
        <mat-icon fontIcon="arrow_back"></mat-icon>
      </button>

      <div class="flex items-center">
        <!-- Task edit button -->
        <button matButton="filled" (click)="openTaskEditDialog()">
          <mat-icon fontIcon="edit"></mat-icon>
          Edit
        </button>

        <button matIconButton>
          <mat-icon fontIcon="more_vert"></mat-icon>
        </button>

        <mat-menu #moreMenu="matMenu">
          <!-- Task delete button -->
          <button mat-menu-item class="mat-error-state" (click)="openConfirmDeleteDialog()">
            Delete
          </button>
        </mat-menu>
      </div>
    </div>

    <app-task-header
      [taskName]="activeTaskData?.name"
      [taskStatus]="activeTaskData?.status"
      [taskStartDate]="activeTaskData?.startDate ?? null"
      [taskDeadline]="activeTaskData?.deadline ?? null"
    />
    <app-task-overview
      [taskStartDate]="activeTaskData?.startDate ?? null"
      [taskDeadline]="activeTaskData?.deadline ?? null"
      [taskDescription]="activeTaskData?.description ?? null"
    />
    <app-task-action
      [taskId]="activeTaskData?.id"
      [taskStatus]="activeTaskData?.status"
      [taskNextAction]="nextTaskAction()"
      [reviews]="reviews()"
      (nextActionTriggered)="transitionTask($event)"
    />
    <app-task-dependency />
    <app-task-subtask />
    <app-task-review-list [reviewList]="reviews()" />
    <app-task-time />
    <app-task-comment />
    <app-task-history />
  </div>
}
