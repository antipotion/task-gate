@let activeTaskData = activeTask();

@if (isLoading()) {
  <app-loading />
} @else {
  <div class="p-4 flex flex-col gap-8 w-full">
    <!-- Navigation and some functions -->
    <div class="flex justify-between">
      <!-- Back button -->
      <button matIconButton (click)="onBack()">
        <mat-icon fontIcon="arrow_back"></mat-icon>
      </button>

      <div class="flex items-center">
        <!-- Task edit button -->
        <button matButton="filled" (click)="openTaskEditDialog()">
          <mat-icon fontIcon="edit"></mat-icon>
          Edit
        </button>

        <!-- Task delete button -->
        <button matButton class="mat-error-state" (click)="openConfirmDeleteDialog()">
          <mat-icon fontIcon="delete"></mat-icon>
          Delete
        </button>
      </div>
    </div>

    <app-task-header
      [taskName]="activeTaskData?.name"
      [taskStatus]="activeTaskData?.status"
      [taskStartDate]="activeTaskData?.startDate ?? null"
      [taskDeadline]="activeTaskData?.deadline ?? null"
    />
    <app-task-overview
      [taskStartDate]="activeTaskData?.startDate ?? null"
      [taskDeadline]="activeTaskData?.deadline ?? null"
      [taskDescription]="activeTaskData?.description ?? null"
    />
    <app-task-action
      [taskId]="activeTaskData?.id"
      [taskStatus]="activeTaskData?.status"
      [taskNextAction]="nextTaskAction()"
      [reviews]="reviews()"
      (nextActionTriggered)="transitionTask($event)"
    />

    <div class="w-full flex justify-center">
      <button matButton (click)="onShowReviewList()">
        <mat-icon fontIcon="list"></mat-icon>
        Show Review List
      </button>
    </div>
  </div>
}
