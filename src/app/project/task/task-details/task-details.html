<div class="p-4 flex flex-col gap-4 w-full">
  <!-- Navigation and some functions -->
  <div class="flex justify-between">
    <!-- Back button -->
    <button matIconButton>
      <mat-icon fontIcon="arrow_back"></mat-icon>
    </button>

    <!-- Task edit button -->
    <button matButton="filled" (click)=openTaskEditDialog()>Edit</button>
  </div>
  
  <app-task-header [taskName]="activeTask()?.name ?? ''" />
  <app-task-overview [taskDeadline]="activeTask()?.deadline ?? ''" />
  <app-task-status [taskStatus]="activeTask()?.status" />
  <app-task-dependency />
  <app-task-subtask />
  <app-task-time />
  <app-task-comment />
  <app-task-history />
</div>
