<section class="flex flex-col gap-4">
  <div class="flex justify-between">
    <h2 class="mat-font-title-md">Resources</h2>
  </div>

  <!-- Contents -->
  <div class="flex flex-col gap-2">
    @for (proof of proofUrls(); track $index) {
      <div class="mat-bg-surface-container-low mat-corner-sm p-4 flex justify-between">
        <div class="flex gap-2 items-center">
          <mat-icon fontIcon="public"></mat-icon>
          <a matButton [href]="proof" target="_blank">{{ proof }}</a>
        </div>
      </div>
    }
  </div>
</section>
