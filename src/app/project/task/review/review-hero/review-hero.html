<!-- INVARIANT: If 'closeStatus' is null then it is on review -->
@let closeStatus = this.closeStatus();

<div class="flex flex-col gap-8">
  <div class="flex flex-col gap-2">
    <div class="flex flex-col gap-4">
      <button matIconButton (click)="onBack()">
        <mat-icon fontIcon="arrow_back"></mat-icon>
      </button>
      <h1 class="mat-font-title-lg">Review title</h1>
    </div>

    <!-- Review status -->
    <div
      class="w-fit px-2 py-1 mat-corner-full"
      [ngClass]="{
        'bg-amber-200': !closeStatus,
        'bg-emerald-200': closeStatus === 'APPROVED',
        'bg-red-200': closeStatus === 'REJECTED',
      }"
    >
      <p>
        @if (!closeStatus) {
          Reviewing
        } @else {
          {{ closeStatus | titlecase }}
        }
      </p>
    </div>
  </div>

  <!-- Names -->
  <div class="mat-bg-surface-container-low mat-corner-sm p-4 grid grid-cols-2 gap-2">
    <!-- Submitted by -->
    <p class="mat-font-label-sm">Submitted by:</p>
    <p class="mat-font-label-sm">
      <span>
        {{ submittedBy() }}
      </span>
    </p>

    <!-- Reviewed by -->
    <p class="mat-font-label-sm">Reviewer:</p>
    <p class="mat-font-label-sm">
      <span>
        {{ reviewer() }}
      </span>
    </p>
  </div>
</div>
