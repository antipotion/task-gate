<section class="flex flex-col gap-4">
  <div class="flex justify-between">
    <h2 class="mat-font-title-md">Task Status</h2>
    <mat-icon fontIcon="expand_more"></mat-icon>
  </div>

  <!-- Contents -->
  <div class="flex flex-col gap-2">
    <!-- Task State -->
    <div class="flex flex-col gap-2">
      <p>Current state</p>
      <mat-chip>{{ taskStatus() | titlecase }}</mat-chip>
      @if (taskNextAction(); as action) {
      <button matButton="filled" (click)="onNextActionTrigger()">{{action | titlecase}}</button>
      }
    </div>
  </div>
</section>
