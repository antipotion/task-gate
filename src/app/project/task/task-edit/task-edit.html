<h2 mat-dialog-title>Edit Task</h2>
<mat-dialog-content>
  <form [formGroup]="taskEditForm">
    <!--Task name-->
    <mat-form-field class="w-full">
      <mat-label>Task name</mat-label>
      <input matInput placeholder="Enter task name" formControlName="name" />
    </mat-form-field>

    <!--Task description-->
    <mat-form-field class="w-full">
      <mat-label>Task description</mat-label>
      <input matInput placeholder="Enter task description" formControlName="description" />
    </mat-form-field>

    <!--Task deadline-->
    <mat-form-field>
      <mat-label>Task deadline</mat-label>
      <input matInput [matDatepicker]="picker" formControlName="deadline" />
      <mat-hint>MM/DD/YYYY</mat-hint>
      <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
      <mat-datepicker #picker></mat-datepicker>
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions>
  <button matButton [mat-dialog-close]="taskEditForm.getRawValue()">Save</button>
  <button matButton class="cancel-btn" (click)="onCancel()">Cancel</button>
</mat-dialog-actions>
