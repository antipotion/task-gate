@let projectName = this.projectName();
@let projectStatus = this.projectStatus();

<section>
  <!-- Project Header -->
  <div class="flex flex-col gap-2">
    @if (!projectName) {
      <mat-spinner diameter="22"></mat-spinner>
    } @else {
      <h1 class="mat-font-title-lg">{{ projectName }}</h1>
    }

    <!-- Badges -->
    <div class="flex gap-2">
      <!-- Status badge -->
      <div
        class="w-fit px-2 py-1 mat-corner-full"
        [ngClass]="{
          'bg-gray-200': projectStatus === 'not started',
          'bg-amber-200': projectStatus === 'in progress',
          'bg-green-200': projectStatus === 'completed',
        }"
      >
        <p class="mat-font-label-sm">{{ projectStatus | titlecase }}</p>
      </div>

      <!-- Health badge -->
      <div class="bg-green-500 w-fit px-2 py-1 mat-corner-full">
        <p class="mat-font-label-sm">Project Health</p>
      </div>
    </div>

    <!-- Project Owner -->
    <div class="flex gap-2">
      <p>Project Owner:</p>
      <p>Owner Name</p>
    </div>

    <!-- Project Members -->
    <div class="flex gap-2">
      <p>Project Members:</p>
      <p>Member Names</p>
    </div>
  </div>
</section>
