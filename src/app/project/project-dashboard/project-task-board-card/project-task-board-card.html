@let tasks = this.tasks();

<div class="flex flex-col gap-1 items-center w-full h-full">
  <div
    class="flex items-center justify-center w-full h-24 mat-bg-surface-container-low mat-corner-sm interactive-item"
    matRipple
  >
    <p class="mat-font-display-lg">{{ tasks?.length }}</p>
  </div>
  <p class="mat-font-title-sm">{{ taskStatus() | titlecase }}</p>
</div>
