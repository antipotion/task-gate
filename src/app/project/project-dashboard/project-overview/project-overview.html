<section class="flex flex-col gap-4">
  <div class="flex justify-between">
    <h2 class="mat-font-title-md">Project Overview</h2>
    <mat-icon fontIcon="expand_more"></mat-icon>
  </div>

  <!-- Contents -->
  <div class="flex flex-col gap-2">
    <!-- Project Description -->
    <div>
      <p>
        @if (description(); as description) {
          {{ description }}
        } @else {
          No description
        }
      </p>
    </div>

    <!-- Project Dates -->
    <div class="flex flex-col gap-1">
      <!-- Start Date -->
      <div>
        <mat-chip>
          <p class="mat-font-label-sm">
            @if (startDate(); as startDate) {
              Start Date: {{ startDate | date }}
            } @else {
              Start Date: No Data
            }
          </p>
        </mat-chip>
      </div>

      <!-- Deadline -->
      <div>
        <mat-chip>
          <p class="mat-font-label-sm">
            @if (deadline(); as deadline) {
              Deadline: {{ deadline | date }}
            } @else {
              Deadline: No Data
            }
          </p>
        </mat-chip>
      </div>
    </div>
  </div>
</section>
