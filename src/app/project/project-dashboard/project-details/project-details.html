@let projectData = project();

@if (isLoading()) {
  <app-loading />
} @else {
  <div class="flex flex-col gap-8 w-full">
    <!-- Back button -->
    <div class="flex justify-between">
      <div class="flex items-center gap-2">
        <button matIconButton (click)="onBack()">
          <mat-icon fontIcon="arrow_back"></mat-icon>
        </button>

        <p class="mat-font-title-md">Project Detail</p>
      </div>

      <div class="flex">
        <button matIconButton [matMenuTriggerFor]="actionMenu">
          <mat-icon fontIcon="more_vert"></mat-icon>
        </button>

        <mat-menu #actionMenu="matMenu">
          <!-- Edit Project Dialog -->
          <button mat-menu-item (click)="openEditDialog()">
            <mat-icon fontIcon="edit"></mat-icon>
            Edit
          </button>

          <!-- Delete button -->
          <button mat-menu-item class="mat-error-state" (click)="onDelete()">
            <mat-icon fontIcon="delete"></mat-icon>
            Delete
          </button>
        </mat-menu>
      </div>
    </div>

    <!-- Contents -->
    <app-project-header
      [projectName]="$safeNavigationMigration(projectData?.name)"
      [projectStatus]="projectStatus()"
      [projectDeadlinePressure]="projectDeadlinePressure()"
    />
    <app-project-overview
      [startDate]="projectData?.startDate ?? null"
      [deadline]="projectData?.deadline ?? null"
      [description]="projectData?.description ?? null"
      [projectOwnerFullName]="userFullName()"
      [currentProgress]="getProjectProgress()"
      [overdueTasksCount]="overdueTasksCount()"
    />
    <app-project-tasks-board />
  </div>
}
