<h1 mat-dialog-title>Edit Project Details</h1>
<mat-dialog-content>
  <form action="" [formGroup]="projectForm" class="flex flex-col items-center">
    <!-- Project name -->
    <mat-form-field class="w-full">
      <mat-label>Project Name</mat-label>
      <input matInput placeholder="e.g. PaperTowel" formControlName="name" />
    </mat-form-field>

    <!-- Project start date -->
    <mat-form-field>
      <mat-label>Project Start Date</mat-label>
      <input matInput [matDatepicker]="projectStartDatePicker" formControlName="startDate" />
      <mat-hint>MM/DD/YYYY</mat-hint>
      <mat-datepicker-toggle matIconSuffix [for]="projectStartDatePicker"></mat-datepicker-toggle>
      <mat-datepicker #projectStartDatePicker></mat-datepicker>
    </mat-form-field>

    <!-- Project deadline -->
    <mat-form-field>
      <mat-label>Project Deadline</mat-label>
      <input matInput [matDatepicker]="picker" formControlName="deadline" />
      <mat-hint>MM/DD/YYYY</mat-hint>
      <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
      <mat-datepicker #picker></mat-datepicker>
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions>
  <button matButton [mat-dialog-close]="projectForm.value">Save</button>
  <button matButton class="mat-error-state" (click)="onCancel()">Cancel</button>
</mat-dialog-actions>
