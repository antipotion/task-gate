<section class="flex flex-col gap-4">
  <div class="flex justify-between">
    <h2 class="mat-font-title-md">Project Metrics</h2>
    <mat-icon fontIcon="expand_more"></mat-icon>
  </div>

  <!-- Metrics Content -->
  <div class="flex flex-col gap-2">
    <!-- Progress -->
    <div class="flex flex-col gap-1">
      <h3 class="mat-font-title-sm">Progress</h3>

      <div class="flex gap-2 items-center">
        <p class="mat-font-body-md">40%</p>
        <mat-progress-bar mode="determinate" value="40"></mat-progress-bar>
      </div>
    </div>

    <!-- Tasks -->
    <div class="flex flex-col gap-1">
      <h3 class="mat-font-title-sm">Tasks</h3>
      <div class="grid grid-cols-2 gap-1">
        <p>Todo</p>
        <p>10</p>
        <p>In Progress</p>
        <p>4</p>
        <p>Blocked</p>
        <p>2</p>
        <p>Done</p>
        <p>8</p>
      </div>
    </div>

    <!-- Team Performance -->
    <div class="flex gap-1">
      <mat-chip>
        <p class="mat-font-label-sm">Overdue: 3</p>
      </mat-chip>
      <mat-chip>
        <p class="mat-font-label-sm">Velocity: 5 tasks/week</p>
      </mat-chip>
    </div>
  </div>
</section>
