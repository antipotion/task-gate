@if (isMobile()) {
  <app-mobile-shell>
    <app-project-dashboard primary />

    <!-- Fab create project button -->
    <button matFab fab (click)="onCreateProject()">
      <mat-icon fontIcon="add"></mat-icon>
    </button>
  </app-mobile-shell>
} @else {
  <app-tablet-shell>
    <app-project-dashboard primary />

    <!-- Fab create project buttons -->
    <button matFab fab (click)="onCreateProject()">
      <mat-icon fontIcon="add"></mat-icon>
    </button>

    <button matFab extended fab-extended (click)="onCreateProject()">
      <mat-icon fontIcon="add"></mat-icon>
      Create Project
    </button>
  </app-tablet-shell>
}
