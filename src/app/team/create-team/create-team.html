<form [formGroup]="teamForm" (ngSubmit)="onCreateTeam()">
  <h2 mat-dialog-title>Create a team</h2>
  <mat-dialog-content>
    <!-- Team name -->
    <mat-form-field>
      <mat-label>Team name</mat-label>
      <input matInput formControlName="teamName" placeholder="Your team's name" />

      @if (teamName.invalid) {
        <mat-error>Team name is required.</mat-error>
      }
    </mat-form-field>
  </mat-dialog-content>
  <mat-dialog-actions>
    <button matButton="filled" type="submit">Create team</button>
    <button matButton type="button" class="mat-error-state" (click)="onNoClick()">Cancel</button>
  </mat-dialog-actions>
</form>
