<form [formGroup]="joinTeamForm" (ngSubmit)="onJoinTeam()">
  <h2 mat-dialog-title>Join a team</h2>
  <mat-dialog-content>
    <!-- Team name -->
    <mat-form-field>
      <mat-label>Team Id</mat-label>
      <input matInput formControlName="teamId" />

      @if (teamId.invalid) {
        <mat-error>Team name is required.</mat-error>
      }
    </mat-form-field>
  </mat-dialog-content>
  <mat-dialog-actions>
    <button matButton="filled" type="submit">Join team</button>
    <button matButton type="button" class="mat-error-state" (click)="onNoClick()">Cancel</button>
  </mat-dialog-actions>
</form>
