<div class="p-4">
  <button matIconButton (click)="onBack()">
    <mat-icon fontIcon="arrow_back"></mat-icon>
  </button>
</div>

<form [formGroup]="joinTeamForm" class="py-32">
  <div class="flex flex-col items-center gap-2">
    <p>Enter your team id</p>

    <!-- Team name -->
    <mat-form-field>
      <mat-label>Team Id</mat-label>
      <input matInput formControlName="teamId" />

      @if (teamId.invalid) {
        <mat-error>Team name is required.</mat-error>
      }
    </mat-form-field>

    <button matButton="filled" (click)="onJoinTeam()">Join team</button>
  </div>
</form>
