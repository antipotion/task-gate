<footer
  class="mat-bg-primary-container mat-text-on-primary-container flex flex-col gap-2 items-center justify-center p-8"
>
  <!-- Social icons -->
  <div>
    @for (social of socialLinks; track $index) {
      <a
        [href]="social.socialLink"
        target="_blank"
        matIconButton
        [ariaLabel]="social.ariaLabel"
        class="mat-primary-container-state"
      >
        <fa-icon [icon]="getSocialIcon(social.accountType)"></fa-icon>
      </a>
    }
  </div>

  <!-- Source links -->
  <div class="flex gap-2">
    <a [href]="projectSourceLinks.portfolioLink" target="_blank" matButton>
      <mat-icon fontIcon="work_outline"></mat-icon>
      Portfolio
    </a>
    <a [href]="projectSourceLinks.sourceLink" target="_blank" matButton>
      <mat-icon fontIcon="code"></mat-icon>
      Source Code
    </a>
  </div>

  <!-- Copyright -->
  <div class="text-center">
    <p>&copy; {{ getCurrentYear }} Antipotion. Licensed under the MIT License</p>
  </div>
</footer>
